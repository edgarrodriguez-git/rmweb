name: tests

# master is upstream's branch. This fork's work lives on wifi-signin, and its release candidates are pushed as
# wifi-signin-v* tags, so both run the host tests too; workflow_dispatch allows a manual run from the Actions tab.
on:
  push:
    branches: [master, wifi-signin]
    tags: ['wifi-signin-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  host-tests:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26: the suite is known green on 24.04's apt
    # shellcheck 0.9.0, OpenSSL 3.0 and libsoup 3.4. Move the pin deliberately, with a run to check it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # run-tests.sh drives clang++ (C++ unit tests), bash (shell tests), shellcheck
      # (lint of the shipped device shell), python3 + openssl (fake captive portal tests) and
      # libsoup-3.0-dev + pkg-config + glib-networking (probe runner test; glib-networking is GIO's TLS backend,
      # which libsoup already pulls in on noble — listed so the dependency is explicit);
      # install the compilers, linter and tools explicitly. Under CI a missing libsoup, OpenSSL 3 or shellcheck
      # fails those tests instead of skipping them.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang shellcheck python3 openssl libsoup-3.0-dev glib-networking pkg-config
      - name: Run host tests
        run: bash scripts/run-tests.sh

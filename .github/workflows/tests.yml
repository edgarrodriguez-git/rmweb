name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # run-tests.sh drives clang++ (C++ unit tests), bash (shell tests), shellcheck
      # (lint of the shipped device shell), python3 + openssl (fake captive portal tests) and
      # libsoup-3.0-dev + pkg-config (probe runner test; libsoup pulls in glib-networking for TLS);
      # install the compilers, linter and tools explicitly.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang shellcheck python3 openssl libsoup-3.0-dev pkg-config
      - name: Run host tests
        run: bash scripts/run-tests.sh
